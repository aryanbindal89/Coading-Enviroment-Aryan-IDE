      <path d="m1340 94 7 7m0-7-7 7" stroke="#817c8c" stroke-width="1.3"/>

      <rect x="513" y="124" width="146" height="439" fill="#17171e"/>
      <path d="M659 124v439" stroke="#2c2933"/>
      <text x="530" y="151" font-size="9" font-weight="700" letter-spacing="1.1" fill="#9792a3">EXPLORER</text>
