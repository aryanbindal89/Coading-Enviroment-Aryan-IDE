<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title description">
  <title id="title">Aryan IDE workspace overview</title>
  <desc id="description">An original vector illustration of a dark coding workspace with a file explorer, code editor, PowerShell terminal, and AI assistant.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171323"/>
      <stop offset=".56" stop-color="#101017"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="editorGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d1a2b"/>
      <stop offset="1" stop-color="#13131c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1440" height="640" rx="26" fill="url(#background)"/>
  <circle cx="1230" cy="65" r="230" fill="#8b5cf6" opacity=".09"/>
  <circle cx="520" cy="655" r="270" fill="#5b4a99" opacity=".08"/>
  <path d="M0 524C266 466 478 632 708 568s502-105 732-38v110H0Z" fill="#171322" opacity=".38"/>

  <g font-family="Segoe UI, Arial, sans-serif">
