      <text x="546" y="179" font-size="11" font-weight="600" fill="#e5e1ee">starter-app</text>
      <text x="547" y="204" font-size="11" fill="#aaa5b5">⌄  src</text>
      <rect x="536" y="213" width="109" height="23" rx="4" fill="#30243f"/>
      <path d="M549 220h9l-1 9h-8Z" fill="#8bb9dd"/>
      <text x="565" y="229" font-size="10" fill="#f0eafd">main.js</text>
      <text x="548" y="258" font-size="10" fill="#aaa5b5">◇  package.json</text>
      <text x="548" y="281" font-size="10" fill="#aaa5b5">▣  README.md</text>
      <path d="M513 306h146" stroke="#2c2933"/>
      <text x="530" y="329" font-size="9" font-weight="700" letter-spacing="1.1" fill="#9792a3">OPEN EDITORS</text>
      <text x="548" y="354" font-size="10" fill="#c7c1d2">main.js</text>
      <text x="548" y="379" font-size="10" fill="#8e8999">README.md</text>

      <rect x="660" y="124" width="427" height="39" fill="#17171e"/>
      <rect x="660" y="124" width="124" height="39" fill="url(#editorGlow)" stroke="#2c2933"/>
      <path d="M660 124h124" stroke="#a78bfa" stroke-width="2"/>
      <path d="M675 140h8v10h-8Z" fill="#e6c17a"/>
      <text x="691" y="148" font-size="10" fill="#f0ecf7">main.js</text>
      <text x="1053" y="148" font-size="10" fill="#aaa5b5">Run  ▶</text>
      <rect x="660" y="163" width="427" height="239" fill="url(#editorGlow)"/>
      <text x="677" y="190" font-family="Consolas, monospace" font-size="11" fill="#746f80">1</text>
      <text x="699" y="190" font-family="Consolas, monospace" font-size="11" fill="#c792ea">const</text>
      <text x="735" y="190" font-family="Consolas, monospace" font-size="11" fill="#e8e3ef"> workspace = {</text>
      <text x="677" y="214" font-family="Consolas, monospace" font-size="11" fill="#746f80">2</text>
      <text x="715" y="214" font-family="Consolas, monospace" font-size="11" fill="#d8b77c">  name</text>
      <text x="753" y="214" font-family="Consolas, monospace" font-size="11" fill="#b6becb">:</text>
      <text x="761" y="214" font-family="Consolas, monospace" font-size="11" fill="#9fd6b9"> 'your-next-idea'</text>
      <text x="677" y="238" font-family="Consolas, monospace" font-size="11" fill="#746f80">3</text>
      <text x="715" y="238" font-family="Consolas, monospace" font-size="11" fill="#d8b77c">  tools</text>
      <text x="755" y="238" font-family="Consolas, monospace" font-size="11" fill="#b6becb">:</text>
      <text x="766" y="238" font-family="Consolas, monospace" font-size="11" fill="#e6c17a"> ['editor', 'terminal']</text>
      <text x="677" y="262" font-family="Consolas, monospace" font-size="11" fill="#746f80">4</text>
      <text x="699" y="262" font-family="Consolas, monospace" font-size="11" fill="#e8e3ef">}</text>
      <text x="677" y="302" font-family="Consolas, monospace" font-size="11" fill="#746f80">5</text>
      <text x="699" y="302" font-family="Consolas, monospace" font-size="11" fill="#c792ea">function</text>
      <text x="754" y="302" font-family="Consolas, monospace" font-size="11" fill="#82c8e8"> start</text>
      <text x="791" y="302" font-family="Consolas, monospace" font-size="11" fill="#e8e3ef">() {</text>
      <text x="677" y="326" font-family="Consolas, monospace" font-size="11" fill="#746f80">6</text>
      <text x="715" y="326" font-family="Consolas, monospace" font-size="11" fill="#8d93a3">  // make it yours</text>
      <text x="677" y="350" font-family="Consolas, monospace" font-size="11" fill="#746f80">7</text>
      <text x="699" y="350" font-family="Consolas, monospace" font-size="11" fill="#e8e3ef">}</text>
      <rect x="660" y="402" width="427" height="160" fill="#111116" stroke="#2c2933"/>
      <rect x="660" y="402" width="427" height="32" fill="#1c1a23"/>
      <text x="677" y="422" font-size="9" font-weight="700" letter-spacing=".9" fill="#c7c1d2">TERMINAL</text>
      <text x="677" y="454" font-family="Consolas, monospace" font-size="10" fill="#70d7ad">PS</text>
      <text x="695" y="454" font-family="Consolas, monospace" font-size="10" fill="#d2cedc"> npm run dev</text>
      <text x="677" y="477" font-family="Consolas, monospace" font-size="10" fill="#9994a5">Ready for the next idea.</text>

      <rect x="1088" y="124" width="285" height="439" fill="#17171e"/>
      <path d="M1088 124v439" stroke="#2c2933"/>
      <circle cx="1110" cy="148" r="8" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".4"/>
      <path d="m1107 148 2 2 4-5" fill="none" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1125" y="152" font-size="10" font-weight="700" letter-spacing=".5" fill="#d5cfdf">AI ASSISTANT</text>
      <path d="M1105 170h249" stroke="#2c2933"/>
      <rect x="1107" y="188" width="222" height="68" rx="8" fill="#201b2d" stroke="#342b47"/>
      <text x="1120" y="209" font-size="10" fill="#e3dced">How should I structure</text>
      <text x="1120" y="226" font-size="10" fill="#e3dced">this new project?</text>
      <rect x="1107" y="273" width="242" height="122" rx="8" fill="#1d1b25" stroke="#302d39"/>
      <circle cx="1121" cy="291" r="4" fill="#a78bfa"/>
      <text x="1133" y="295" font-size="9" font-weight="600" fill="#dcd6e7">A helpful starting point</text>
      <text x="1120" y="319" font-size="9" fill="#aaa5b5">Group code by feature, keep</text>
      <text x="1120" y="335" font-size="9" fill="#aaa5b5">shared utilities small, and</text>
      <text x="1120" y="351" font-size="9" fill="#aaa5b5">add tests around core logic.</text>
      <text x="1120" y="379" font-size="9" fill="#c4b5fd">Review suggestion →</text>
      <rect x="1107" y="508" width="242" height="35" rx="7" fill="#211e29" stroke="#393442"/>
      <text x="1120" y="530" font-size="9" fill="#777282">Ask about your code...</text>
      <circle cx="1328" cy="525" r="10" fill="#8055c7"/>
      <path d="m1324 525 7 0m-3-3 3 3-3 3" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="82" y="567" font-size="11" fill="#807b8d">Explore files</text>
    <circle cx="167" cy="563" r="2" fill="#6d6780"/>
    <text x="181" y="567" font-size="11" fill="#807b8d">Write and run code</text>
    <circle cx="293" cy="563" r="2" fill="#6d6780"/>
    <text x="307" y="567" font-size="11" fill="#807b8d">Keep your workflow close</text>
  </g>
</svg>
