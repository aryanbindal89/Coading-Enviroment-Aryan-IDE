      <path d="M596 97h7m-3.5-3.5v7" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
      <text x="620" y="102" font-size="12" font-weight="600" fill="#eeeaf7">Aryan IDE</text>
      <text x="1291" y="101" font-size="11" fill="#817c8c">—</text>
