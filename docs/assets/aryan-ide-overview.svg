    <circle cx="101" cy="108" r="4" fill="#c4b5fd"/>
    <text x="115" y="112" font-size="12" font-weight="700" letter-spacing="1.6" fill="#d8ccff">YOUR WINDOWS CODING DESK</text>
    <text x="80" y="211" font-size="59" font-weight="700" letter-spacing="-2.8" fill="#f5f2ff">Make room</text>
    <text x="80" y="275" font-size="59" font-weight="700" letter-spacing="-2.8" fill="#f5f2ff">for good code.</text>
    <text x="84" y="328" font-size="18" fill="#aaa6ba">Edit, run, and manage projects from one</text>
    <text x="84" y="354" font-size="18" fill="#aaa6ba">focused desktop workspace.</text>

    <g font-size="12" font-weight="600">
      <rect x="82" y="405" width="116" height="31" rx="15.5" fill="#1c1a27" stroke="#373142"/>
      <circle cx="100" cy="420" r="4" fill="#a78bfa"/>
      <text x="112" y="424" fill="#ddd8e9">Multi-language</text>
      <rect x="208" y="405" width="101" height="31" rx="15.5" fill="#1c1a27" stroke="#373142"/>
      <circle cx="226" cy="420" r="4" fill="#70d7ad"/>
      <text x="238" y="424" fill="#ddd8e9">Git ready</text>
      <rect x="319" y="405" width="115" height="31" rx="15.5" fill="#1c1a27" stroke="#373142"/>
      <circle cx="337" cy="420" r="4" fill="#8cb9ed"/>
      <text x="349" y="424" fill="#ddd8e9">AI optional</text>
    </g>

